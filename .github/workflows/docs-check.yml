name: Documentation checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  validate-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check documentation structure and local links
        run: python3 scripts/check_docs.py
      - name: Test strict PlantUML-to-Mermaid conversion
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Verify canonical Mermaid sources and gallery
        run: python3 scripts/diagrams.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Mermaid renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-cli"
          npm install --prefix "$RUNNER_TEMP/mermaid-cli" --no-save --no-audit --no-fund --ignore-scripts @mermaid-js/mermaid-cli@11.17.0
          CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          printf '{"executablePath":"%s","args":["--no-sandbox"]}\n' "$CHROME" > "$RUNNER_TEMP/mermaid-puppeteer.json"
      - name: Render every Mermaid diagram in Chromium
        env:
          MERMAID_CLI: ${{ runner.temp }}/mermaid-cli/node_modules/.bin/mmdc
          MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/mermaid-puppeteer.json
        run: bash scripts/validate-mermaid.sh
      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq plantuml graphviz
      - name: Check PlantUML syntax and regenerate SVG
        run: bash scripts/render-diagrams.sh
      - name: Reject stale or missing generated diagrams
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          sources=(docs/architecture/*.puml)
          svgs=(docs/architecture/rendered/*.svg)
          mmds=(docs/architecture/mermaid/*.mmd)
          test "${#sources[@]}" -eq "${#svgs[@]}"
          test "${#sources[@]}" -eq "${#mmds[@]}"
          git diff --exit-code -- docs/architecture/rendered docs/architecture/mermaid docs/architecture/diagrams.md
          unexpected="$(git ls-files --others --exclude-standard docs/architecture/rendered docs/architecture/mermaid docs/architecture/diagrams.md)"
          test -z "$unexpected" || { printf 'Untracked generated diagram(s):\n%s\n' "$unexpected"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: fiscalwave-architecture-svg
          path: docs/architecture/rendered/*.svg
          retention-days: 7
