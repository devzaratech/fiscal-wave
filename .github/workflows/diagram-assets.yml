name: Regenerate diagram assets on feature branches
on:
  push:
    branches-ignore: [main]
    paths:
      - 'docs/architecture/*.puml'
      - 'scripts/diagrams.py'
      - 'scripts/render-diagrams.sh'
      - 'scripts/validate-mermaid.sh'
      - '.github/workflows/diagram-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagrams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    if: github.ref == 'refs/heads/docs/diagram-publishing'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refresh current feature-branch head
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "$TARGET_BRANCH" || "$TARGET_BRANCH" == "main" ]]; then
            echo 'Refusing unsafe branch name' >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$TARGET_BRANCH"
          git checkout -B "$TARGET_BRANCH" FETCH_HEAD
      - name: Install PlantUML and Graphviz
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq plantuml graphviz
      - name: Regenerate SVG and supported Mermaid diagrams
        run: bash scripts/render-diagrams.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Mermaid renderer
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/mermaid-cli"
          npm install --prefix "$RUNNER_TEMP/mermaid-cli" --no-save --no-audit --no-fund --ignore-scripts @mermaid-js/mermaid-cli@11.17.0
          CHROME="$(command -v google-chrome || command -v chromium)"
          test -n "$CHROME"
          printf '{"executablePath":"%s","args":["--no-sandbox"]}\n' "$CHROME" > "$RUNNER_TEMP/mermaid-puppeteer.json"
      - name: Regenerate white Mermaid SVG previews
        env:
          MERMAID_CLI: ${{ runner.temp }}/mermaid-cli/node_modules/.bin/mmdc
          MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/mermaid-puppeteer.json
          MERMAID_OUTPUT_DIR: docs/architecture/rendered/mermaid
        run: |
          mkdir -p "$MERMAID_OUTPUT_DIR"
          find "$MERMAID_OUTPUT_DIR" -maxdepth 1 -type f -name '*.svg' -delete
          bash scripts/validate-mermaid.sh
      - name: Commit generated assets to this branch only
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == main || -z "$TARGET_BRANCH" ]]; then
            echo 'Refusing to write main or an unknown branch' >&2
            exit 1
          fi
          git add -A docs/architecture/mermaid docs/architecture/diagrams.md docs/architecture/rendered
          if git diff --cached --quiet; then
            echo 'Generated diagram assets already up-to-date'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs(FW-033): regenerate derived Mermaid and SVG architecture views'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
